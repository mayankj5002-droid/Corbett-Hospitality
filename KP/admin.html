    <!-- JAVASCRIPT -->

    <script>


        // ==============================
        // ADMIN LOGIN CHECK
        // ==============================

        const token = sessionStorage.getItem("adminToken");


        if (!token) {

            window.location.href = "login.html";

        }


        let allBookings = [];
        
        function updateDashboardSummary() {

    const total = allBookings.length;

    const safari = allBookings.filter(
        booking => booking.bookingType === "Safari"
    ).length;

    const hotel = allBookings.filter(
        booking => booking.bookingType === "Hotel"
    ).length;

    const taxi = allBookings.filter(
        booking => booking.bookingType === "Taxi"
    ).length;

    const pending = allBookings.filter(
        booking => (booking.status || "Pending") === "Pending"
    ).length;

    const confirmed = allBookings.filter(
        booking => booking.status === "Confirmed"
    ).length;

    const cancelled = allBookings.filter(
    booking => booking.status === "Cancelled"
).length;

    document.getElementById("totalBookings").textContent = total;
    document.getElementById("safariBookings").textContent = safari;
    document.getElementById("hotelBookings").textContent = hotel;
    document.getElementById("taxiBookings").textContent = taxi;
    document.getElementById("pendingBookings").textContent = pending;
    document.getElementById("confirmedBookings").textContent = confirmed;
    document.getElementById("cancelledBookings").textContent = cancelled;
}       



        // ==============================
        // LOAD BOOKINGS
        // ==============================

        async function loadBookings() {

            try {

                const response = await fetch(
                    "http://localhost:5000/api/bookings",
                    {
                        method: "GET",

                        headers: {
                            "Authorization": "Bearer " + token
                        }
                    }
                );


                const data = await response.json();


                console.log(
                    "Bookings from backend:",
                    data
                );


                if (!response.ok) {

                    if (response.status === 401) {

                        sessionStorage.removeItem(
                            "adminToken"
                        );

                        sessionStorage.removeItem(
                            "adminLoggedIn"
                        );

                        window.location.href =
                            "login.html";

                        return;
                    }


                    throw new Error(
                        data.message ||
                        "Unable to load bookings."
                    );
                }


                allBookings = data;
                
                
                updateDashboardSummary();


                updateDashboard();

                displayBookings("All");


            } catch (error) {

                console.error(
                    "Booking loading error:",
                    error
                );


                document.getElementById(
                    "bookingsContainer"
                ).innerHTML = `

                    <p class="error">
                        Unable to load bookings:
                        ${error.message}
                    </p>

                `;

            }

        }



        // ==============================
        // UPDATE DASHBOARD
        // ==============================

        function updateDashboard() {


            document.getElementById(
                "totalBookings"
            ).textContent =
                allBookings.length;



            document.getElementById(
                "safariBookings"
            ).textContent =

                allBookings.filter(
                    booking =>
                        booking.bookingType === "Safari"
                ).length;



            document.getElementById(
                "hotelBookings"
            ).textContent =

                allBookings.filter(
                    booking =>
                        booking.bookingType === "Hotel"
                ).length;



            document.getElementById(
                "taxiBookings"
            ).textContent =

                allBookings.filter(
                    booking =>
                        booking.bookingType === "Taxi"
                ).length;

        }



        // ==============================
        // FILTER BOOKINGS
        // ==============================

        function filterBookings(type) {

            displayBookings(type);

        }


        function filterByStatus(status) {

    const filteredBookings = allBookings.filter(
        booking => (booking.status || "Pending") === status
    );

    displaySearchResults(filteredBookings);
}


        function searchBookings() {
    const searchText =
        document.getElementById("searchInput").value
        .toLowerCase()
        .trim();

    const selectedDate =
        document.getElementById("dateFilter").value;

    const filteredBookings = allBookings.filter(booking => {

        const name =
            (booking.name || booking.guestName || "").toLowerCase();

        const phone =
            (booking.phone || "").toLowerCase();

        const matchesSearch =
            name.includes(searchText) ||
            phone.includes(searchText);

        const matchesDate =
            !selectedDate ||
            booking.date === selectedDate ||
            booking.checkIn === selectedDate ||
            booking.checkOut === selectedDate;

        return matchesSearch && matchesDate;
    });

    displaySearchResults(filteredBookings);
}

function filterByDate() {
    const selectedDate = document.getElementById("dateFilter").value;

    if (!selectedDate) {
        displayBookings("All");
        return;
    }

    const filteredBookings = allBookings.filter(booking => {
        return (
            booking.date === selectedDate ||
            booking.checkIn === selectedDate ||
            booking.checkOut === selectedDate
        );
    });

    displaySearchResults(filteredBookings);
}

function displaySearchResults(bookings) {

    const container =
        document.getElementById("bookingsContainer");

    container.innerHTML = "";

    if (bookings.length === 0) {

        container.innerHTML =
            "<p>No bookings found.</p>";

        return;
    }

    bookings.forEach((booking) => {

        const originalIndex =
            allBookings.indexOf(booking);

        const div =
            document.createElement("div");

        div.className = "booking";


        let details = `

            <p>
                <strong>Customer Name:</strong>
                ${
                    booking.name ||
                    booking.guestName ||
                    "N/A"
                }
            </p>

            <p>
                <strong>Phone:</strong>
                ${booking.phone || "N/A"}
            </p>

        `;


        // SAFARI

        if (booking.bookingType === "Safari") {

            details += `

                <p>
                    <strong>Activity:</strong>
                    ${booking.activity || "N/A"}
                </p>

                <p>
                    <strong>Zone:</strong>
                    ${booking.zone || "N/A"}
                </p>

                <p>
                    <strong>Date:</strong>
                    ${booking.date || "N/A"}
                </p>

                <p>
                    <strong>Guests:</strong>
                    ${booking.guests || "N/A"}
                </p>

                <p>
                    <strong>Price:</strong>
                    ${booking.price || "N/A"}
                </p>

            `;
        }


        // HOTEL

        if (booking.bookingType === "Hotel") {

            details += `

                <p>
                    <strong>Hotel:</strong>
                    ${
                        booking.hotel ||
                        booking.hotelName ||
                        "N/A"
                    }
                </p>

                <p>
                    <strong>Check-in:</strong>
                    ${booking.checkIn || "N/A"}
                </p>

                <p>
                    <strong>Check-out:</strong>
                    ${booking.checkOut || "N/A"}
                </p>

                <p>
                    <strong>Guests:</strong>
                    ${booking.guests || "N/A"}
                </p>

                <p>
                    <strong>Price:</strong>
                    ${booking.price || "N/A"}
                </p>

            `;
        }


        // TAXI

        if (booking.bookingType === "Taxi") {

            details += `

                <p>
                    <strong>Pickup:</strong>
                    ${booking.pickup || "N/A"}
                </p>

                <p>
                    <strong>Drop:</strong>
                    ${booking.drop || "N/A"}
                </p>

                <p>
                    <strong>Date:</strong>
                    ${booking.date || "N/A"}
                </p>

                <p>
                    <strong>Time:</strong>
                    ${booking.time || "N/A"}
                </p>

                <p>
                    <strong>Price:</strong>
                    ${booking.price || "N/A"}
                </p>

            `;
        }


        // BOOKING CARD

        div.innerHTML = `

            <h2>
                Booking #${originalIndex + 1}
            </h2>

            <p class="type">
                ${
                    booking.bookingType === "Safari"
                    ? "🦁 Safari Booking"
                    : booking.bookingType === "Hotel"
                    ? "🏨 Hotel Booking"
                    : booking.bookingType === "Taxi"
                    ? "🚕 Taxi Booking"
                    : "📋 Booking"
                }
            </p>

            ${details}

            <p>
    <strong>Booking Created:</strong>
    ${booking.bookingDate || "N/A"}
</p>

<div style="margin-top: 15px;">
    <label><strong>Booking Status:</strong></label>

    <select
        onchange="updateBookingStatus(${originalIndex}, this.value)"
        style="
            padding: 8px;
            margin-left: 10px;
            border-radius: 5px;
        "
    >
        <option value="Pending">🟡 Pending</option>
        <option value="Confirmed">🟢 Confirmed</option>
        <option value="Cancelled">🔴 Cancelled</option>
    </select>
</div>

<br>

<button
    class="delete-btn"
    data-index="${originalIndex}">
    🗑️ Delete Booking
</button>
        `;


        div.querySelector(
            ".delete-btn"
        ).addEventListener(
            "click",
            function () {

                deleteBooking(
                    Number(this.dataset.index)
                );

            }
        );


        container.appendChild(div);

    });
}



        // ==============================
        // DISPLAY BOOKINGS
        // ==============================

                ${
                    booking.bookingType === "Safari"
                    ? "🦁 Safari Booking"
                    : booking.bookingType === "Hotel"
                    ? "🏨 Hotel Booking"
                    : booking.bookingType === "Taxi"
                    ? "🚕 Taxi Booking"
                    : "📋 Booking"
                }
            </p>

            ${details}

            <p>
                <strong>Booking Created:</strong>
                ${booking.bookingDate || "N/A"}
            </p>

            <div style="margin-top: 15px;">

                <label>
                    <strong>Booking Status:</strong>
                </label>

                <select
                    onchange="updateBookingStatus(${originalIndex}, this.value)"
                    style="
                        padding: 8px;
                        margin-left: 10px;
                        border-radius: 5px;
                    "
                >

                    <option value="Pending"
                        ${
                            (booking.status || "Pending") === "Pending"
                            ? "selected"
                            : ""
                        }>
                        🟡 Pending
                    </option>

                    <option value="Confirmed"
                        ${
                            booking.status === "Confirmed"
                            ? "selected"
                            : ""
                        }>
                        🟢 Confirmed
                    </option>

                    <option value="Cancelled"
                        ${
                            booking.status === "Cancelled"
                            ? "selected"
                            : ""
                        }>
                        🔴 Cancelled
                    </option>

                </select>

                <br><br>

<button
    onclick="showBookingDetails(${originalIndex})"
    style="
        padding: 10px 18px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
    "
>
    👁️ View Details
</button>
<br><br>

<button
    onclick="editBooking(${originalIndex})"
    style="
        padding: 10px 18px;
        background: #f59e0b;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
    "
>
    ✏️ Edit Booking
</button>

            </div>

            <br>

            <button
                class="delete-btn"
                data-index="${originalIndex}">
                🗑️ Delete Booking
            </button>

        `;


        div.querySelector(".delete-btn").addEventListener(
            "click",
            function () {

                deleteBooking(
                    Number(this.dataset.index)
                );

            }
        );


        container.appendChild(div);

    });
}

        async function updateBookingStatus(index, status) {
    try {
        const response = await fetch(
            `http://localhost:5000/api/bookings/${index}`,
            {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },
                body: JSON.stringify({
                    status: status
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            alert(data.message || "Failed to update status");
            return;
        }

        alert("Booking status updated successfully!");

        loadBookings();

    } catch (error) {
    alert("ERROR: " + error.message);
    console.log("Status update error:", error);
}
}



        // ==============================
        // DELETE BOOKING
        // ==============================

        async function deleteBooking(index) {


            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this booking?"
                );


            if (!confirmDelete) {

                return;

            }


            try {


                const response =
                    await fetch(
                        `http://localhost:5000/api/bookings/${index}`,
                        {
                            method: "DELETE",

                            headers: {
                                "Authorization":
                                    "Bearer " + token
                            }
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Could not delete booking."
                    );

                }


                alert(
                    "Booking deleted successfully!"
                );


                await loadBookings();


            } catch (error) {

                console.error(
                    "Delete error:",
                    error
                );


                alert(
                    "Could not delete booking."
                );

            }

        }



        // ==============================
        // LOGOUT
        // ==============================

        function logoutAdmin() {

            sessionStorage.removeItem(
                "adminToken"
            );


            sessionStorage.removeItem(
                "adminLoggedIn"
            );


            window.location.href =
                "login.html";

        }



        // ==============================
        // START DASHBOARD
        // ==============================

        loadBookings();

function showBookingDetails(index) {

    const booking = allBookings[index];

    if (!booking) {
        alert("Booking details not found.");
        return;
    }

    const modal = document.getElementById("bookingModal");
    const content = document.getElementById("bookingModalContent");

    let html = "";

    Object.entries(booking).forEach(([key, value]) => {

        let label = key
            .replace(/([A-Z])/g, " $1")
            .replace(/^./, str => str.toUpperCase());

        html += `
            <div style="
                padding: 10px 0;
                border-bottom: 1px solid #eee;
            ">
                <strong>${label}:</strong>
                <span style="margin-left: 8px;">
                    ${value || "N/A"}
                </span>
            </div>
        `;
    });

    content.innerHTML = html;

    modal.style.display = "flex";
}
function closeBookingModal() {
    document.getElementById("bookingModal").style.display = "none";
}
function editBooking(index) {

    const booking = allBookings[index];

    if (!booking) {
        alert("Booking not found.");
        return;
    }

    // Remember which booking we are editing
    editingBookingIndex = index;

    // Fill the form with existing details
    document.getElementById("editName").value =
        booking.name || booking.guestName || "";

    document.getElementById("editPhone").value =
        booking.phone || "";

    document.getElementById("editEmail").value =
        booking.email || "";

    // Open edit modal
    document.getElementById("editBookingModal").style.display = "flex";
}

let editingBookingIndex = null;


// ===============================
// OPEN EDIT BOOKING MODAL
// ===============================

function editBooking(index) {

    const booking = allBookings[index];

    if (!booking) {
        alert("Booking not found.");
        return;
    }

    editingBookingIndex = index;

    // Fill existing values
    document.getElementById("editName").value =
        booking.name || booking.guestName || "";

    document.getElementById("editPhone").value =
        booking.phone || "";

    document.getElementById("editEmail").value =
        booking.email || "";

    // Show modal
    document.getElementById("editBookingModal").style.display = "flex";
}


// ===============================
// CLOSE EDIT MODAL
// ===============================

function closeEditBookingModal() {

    document.getElementById("editBookingModal").style.display = "none";

    editingBookingIndex = null;
}


// ===============================
// SAVE EDITED BOOKING
// ===============================

async function saveEditedBooking() {

    if (editingBookingIndex === null) {
        alert("No booking selected.");
        return;
    }

    const name =
        document.getElementById("editName").value.trim();

    const phone =
        document.getElementById("editPhone").value.trim();

    const email =
        document.getElementById("editEmail").value.trim();


    // Basic validation
    if (!name) {
        alert("Please enter customer name.");
        return;
    }

    if (!phone) {
        alert("Please enter phone number.");
        return;
    }


  
const token = sessionStorage.getItem("adminToken");


    if (!token) {
        alert("Admin session expired. Please login again.");
        return;
    }


    try {

        const response = await fetch(
            `http://localhost:5000/api/bookings/${editingBookingIndex}`,
            {
                method: "PUT",

                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },

                body: JSON.stringify({
                    name: name,
                    phone: phone,
                    email: email
                })
            }
        );


        const data = await response.json();


        if (!response.ok) {

            alert(
                data.message ||
                "Failed to update booking."
            );

            return;
        }


        alert("✅ Booking updated successfully!");


        // Close modal
        closeEditBookingModal();


        // Reload bookings
        loadBookings();


    } catch (error) {

        console.error(
            "Edit booking error:",
            error
        );

        alert(
            "❌ Error updating booking: " +
            error.message
        );
    }
}
</script>
