<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .login-box {
            background: white;
            width: 350px;
            padding: 35px;

            border-radius: 12px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.15);

            text-align: center;
        }

        .login-box h1 {
            margin-bottom: 25px;
        }

        .login-box input {
            width: 100%;
            box-sizing: border-box;

            padding: 12px;
            margin: 10px 0;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 16px;
        }

        .login-box button {
            width: 100%;

            padding: 12px;
            margin-top: 15px;

            background: #222;
            color: white;

            border: none;
            border-radius: 6px;

            font-size: 16px;
            cursor: pointer;
        }

        .login-box button:hover {
            background: #444;
        }

        #errorMessage {
            color: red;
            margin-top: 15px;
        }

    </style>

</head>


<body>


    <div class="login-box">

        <h1>🔐 Admin Login</h1>

        <input
            type="text"
            id="username"
            placeholder="Username"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button onclick="login()">
            LOGIN
        </button>

        <p id="errorMessage"></p>

    </div>


    <script>

        async function login() {

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            const errorMessage =
                document.getElementById("errorMessage");


            // Check empty fields
            if (!username || !password) {

                errorMessage.textContent =
                    "Please enter username and password.";

                return;
            }


            try {

                const response = await fetch(
                    "http://localhost:5000/api/admin-login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    }
                );


                const data = await response.json();


                if (data.success) {

                    // Save login token
                    sessionStorage.setItem(
                        "adminToken",
                        data.token
                    );

                    sessionStorage.setItem(
                        "adminLoggedIn",
                        "true"
                    );


                    // Open admin dashboard
                    window.location.href = "admin.html";


                } else {

                    errorMessage.textContent =
                        data.message ||
                        "Invalid username or password.";

                }


            } catch (error) {

                console.error("Login error:", error);

                errorMessage.textContent =
                    "Unable to connect to server.";

            }

        }

    </script>


</body>

</html>
